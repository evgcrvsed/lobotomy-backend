# Фиксируем имя проекта, чтобы оно не зависело от папки, из которой запущен compose
name: lobotomy

services:
  db:
    container_name: lobotomy-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lobotomy
    ports:
      # Только локальный доступ — чтобы на сервере Postgres не торчал наружу
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 15

  backend:
    container_name: lobotomy-backend
    build: .
    # Явное имя образа: его же переиспользует cdek-worker, отдельного образа под воркер нет
    image: lobotomy-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/lobotomy
      # Авторизация: задаются в .env рядом с компоузом
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      # Вход по коду на почту (Resend)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-onboarding@resend.dev}
      # Отдельный адрес для писем о заказах — чтобы не приходили от auth@
      EMAIL_FROM_ORDERS: ${EMAIL_FROM_ORDERS:-orders@lobo1omy.store}
      # Оплата (Т-Банк)
      TINKOFF_TERMINAL_KEY: ${TINKOFF_TERMINAL_KEY:-}
      TINKOFF_PASSWORD: ${TINKOFF_PASSWORD:-}
      # Система налогообложения и НДС для фискального чека — сверить с бухгалтером
      TINKOFF_RECEIPT_TAXATION: ${TINKOFF_RECEIPT_TAXATION:-patent}
      TINKOFF_RECEIPT_VAT: ${TINKOFF_RECEIPT_VAT:-none}
      SITE_URL: ${SITE_URL:-https://lobo1omy.store}
      # СДЭК — автообновление статусов заказов по трек-номеру
      CDEK_CLIENT_ID: ${CDEK_CLIENT_ID:-}
      CDEK_CLIENT_SECRET: ${CDEK_CLIENT_SECRET:-}
      # Google-таблица — сюда выгружаются проданные позиции. Backend в Google не
      # ходит, но проверяет настройки перед тем, как ставить задачу в очередь.
      GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID:-}
    volumes:
      # Загруженные через админку фото должны переживать пересборку контейнера
      - static_images:/app/static/images
      # Оригиналы, отложенные скриптом сжатия
      - static_originals:/app/static/originals
      # Ключ Google: backend в таблицу не ходит, но проверяет, что ключ на месте,
      # прежде чем ставить задачу в очередь — иначе кнопка вешала бы её впустую
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy

  # Автообновление статусов заказов по трек-номерам СДЭК.
  # Раньше жило asyncio-задачей внутри backend; вынесено отдельным процессом,
  # чтобы рестарт API не обрывал проход опроса и чтобы логи не смешивались.
  # База общая с backend — это разделение по процессам, а не по данным.
  cdek-worker:
    container_name: lobotomy-cdek-worker
    build: .
    image: lobotomy-backend
    # Тот же образ, другая точка входа
    command: ["python", "-m", "backend.workers.cdek"]
    # unless-stopped, а не on-failure. Раньше стояло on-failure ради одного случая:
    # без ключей воркер осознанно выходит с кодом 0, и крутить его незачем.
    # Но с тем же кодом 0 он выходит и после SIGTERM — а значит после любого
    # сигнала (перезапуск демона, пересоздание соседей) больше не поднимался
    # и молча лежал. Случай «нет ключей» теперь решается иначе: воркер не выходит,
    # а спит — см. idle_forever в backend/workers/.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/lobotomy
      # СДЭК — единственная внешняя система, которая нужна этому процессу.
      # Пустой CLIENT_ID — воркер сразу завершится с понятной строкой в логе.
      CDEK_CLIENT_ID: ${CDEK_CLIENT_ID:-}
      CDEK_CLIENT_SECRET: ${CDEK_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      # Схему создаёт backend. service_started даёт лишь порядок запуска,
      # поэтому воркер дополнительно ждёт таблицу сам — wait_for_schema().
      backend:
        condition: service_started

  # Выгрузка заказов в Google-таблицу: лист на товар, строка на заказ.
  # Кнопка в админке кладёт задачу в таблицу export_jobs, этот процесс её забирает.
  # Отдельно от backend по двум причинам: gspread синхронный (в event loop API он
  # вставал бы поперёк запросов) и выгрузка — это минуты походов в чужой API.
  sheets-worker:
    container_name: lobotomy-sheets-worker
    build: .
    image: lobotomy-backend
    # Тот же образ, другая точка входа — как у cdek-worker
    command: ["python", "-m", "backend.workers.sheets"]
    # unless-stopped — см. разбор у cdek-worker. Именно из-за on-failure этот
    # контейнер однажды лёг после сигнала, и кнопка в админке «синхронизировала»
    # бесконечно: задача висела в pending, потому что забирать её было некому.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/lobotomy
      # Единственная внешняя система этого процесса. Пусто — сразу выходит
      # с понятной строкой в логе, а кнопка в админке вернёт 503.
      GOOGLE_SHEETS_ID: ${GOOGLE_SHEETS_ID:-}
    volumes:
      # Ключ сервисного аккаунта: в образе его нет (см. .dockerignore),
      # подкладывается отсюда — так его меняют без пересборки
      - ./secrets:/app/secrets:ro
    depends_on:
      db:
        condition: service_healthy
      # Схему создаёт backend; воркер дополнительно ждёт таблицу сам — wait_for_schema()
      backend:
        condition: service_started

  frontend:
    container_name: lobotomy-frontend
    restart: unless-stopped
    # Путь до репозитория фронтенда (клонировать рядом с этим репозиторием).
    # Локально можно переопределить в .env: FRONTEND_DIR=<путь>
    build:
      context: ${FRONTEND_DIR:-../lobotomy-frontend}
      args:
        # ID приложения VK ID — вшивается во фронтенд при сборке
        VITE_VK_APP_ID: ${VITE_VK_APP_ID:-}
    environment:
      # За Caddy этот nginx видит лишь внутренний адрес прокси, поэтому
      # ограничение по IP теперь на Caddy. Тут всегда открыто для внутренней сети.
      ALLOWED_IP: "0.0.0.0/0"
    expose:
      - "80"
    depends_on:
      - backend

  caddy:
    container_name: lobotomy-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3 (443/udp) отключён — на этом сервере QUIC нестабилен
    environment:
      # Домен для HTTPS (в .env: SITE_DOMAIN=lobo1omy.store). Не задан — работает по HTTP на :80.
      SITE_DOMAIN: ${SITE_DOMAIN:-:80}
      # Ограничение по IP (реальный адрес клиента виден на входе). Пусто в .env — открыто всем.
      ALLOWED_IP: ${ALLOWED_IP:-0.0.0.0/0 ::/0}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # сюда Caddy кладёт сертификаты — переживают пересоздание
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  postgres_data:
  static_images:
  static_originals:
  caddy_data:
  caddy_config:
